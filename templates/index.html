<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Street Bar - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Oswald', sans-serif; 
            background-color: #050505; 
            background-image: radial-gradient(circle at center, #111827 0%, #000000 100%);
        }
        
        .gold-text {
            background: linear-gradient(to bottom, #fde047, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .neon-green { 
            color: #22c55e; 
            text-shadow: 0 0 1vh rgba(34, 197, 94, 0.5); 
        }
        
        .neon-red { 
            color: #ef4444; 
            text-shadow: 0 0 1vh rgba(239, 68, 68, 0.5); 
        }

        @keyframes crash-alert-pulse {
            0%, 100% { box-shadow: 0 0 1vh rgba(239, 68, 68, 0.45); }
            50% { box-shadow: 0 0 3vh rgba(248, 113, 113, 0.95); }
        }

        .crash-alert {
            animation: crash-alert-pulse 1s ease-in-out infinite;
        }
        
        .board-container {
            border: 0.4vh solid #b48600;
            box-shadow: 0 0 4vh rgba(180, 134, 0, 0.25), inset 0 0 3vh rgba(180, 134, 0, 0.15);
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }

        .row-border { 
            border-bottom: 0.15vh solid rgba(255, 255, 255, 0.05); 
        }

        .columns-balance {
            column-fill: balance;
        }
    </style>
</head>
<body class="text-gray-200 h-screen w-screen overflow-hidden p-[2vh] flex flex-col items-center relative">

    <!-- Active Crash Alert -->
    <div id="crash-alert" class="hidden shrink-0 w-full max-w-[96vw] mb-[1.5vh] rounded-[1vh] border-[0.4vh] border-red-300 bg-red-700 px-[2vw] py-[1.2vh] text-center text-white crash-alert" role="alert" aria-live="assertive">
        <span class="flex items-center justify-center gap-[1vw] text-[3vh] font-bold uppercase tracking-[0.15em]">
            <i class="fa-solid fa-clock fa-spin"></i>
            <span>MARKET CRASH ACTIVE</span>
            <i class="fa-solid fa-clock fa-spin"></i>
        </span>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button onclick="toggleFullScreen()" class="absolute top-[2vh] right-[2vw] z-50 p-[1vh] text-transparent hover:text-slate-500 transition" title="Toggle Fullscreen">
        <i id="fsIcon" class="fa-solid fa-expand text-[2.5vh]"></i>
    </button>

    <!-- Header Section -->
    <header class="shrink-0 text-center mb-[2vh] space-y-[0.5vh]">
        <p class="text-gray-400 tracking-[0.3em] text-[1.5vh] uppercase">Blok 1 Eksamensfest</p>
        <h1 class="text-[6vh] font-bold gold-text uppercase tracking-wider filter drop-shadow-lg leading-none">
            Wall Street Bar
        </h1>
        <div class="flex items-center justify-center gap-[2vw] text-green-500 font-bold text-[1.8vh] tracking-widest pt-[0.5vh]">
            <span>DRINKS</span> <span><i class="fa-solid fa-xmark text-gray-500 text-[1vh]"></i></span> 
            <span>STOCKS</span> <span><i class="fa-solid fa-xmark text-gray-500 text-[1vh]"></i></span> 
            <span>PARTY</span>
        </div>
    </header>

    <!-- Main Stock Exchange Board -->
    <main class="board-container rounded-[1vh] w-full max-w-[96vw] p-[3vh] relative z-10 flex-1 flex flex-col min-h-0">
        
        <div class="w-full flex-1 flex flex-col min-h-0">
            <!-- Board Title Row -->
            <div class="shrink-0 flex items-end border-b-[0.3vh] border-green-500/50 pb-[1vh] mb-[1.5vh]">
                <h2 class="text-[3.5vh] font-bold neon-green flex items-center gap-[1vw]">
                    <i class="fa-solid fa-arrow-trend-up text-[3vh]"></i> LIVE TRADING
                </h2>
            </div>
            
            <!-- Dynamic Data Container: Flows cleanly across columns without rigid category wrappers -->
            <div id="price-board" class="flex-1 w-full columns-1 lg:columns-2 xl:columns-3 columns-balance gap-x-[4vw] font-medium overflow-hidden">
                <div class="text-center text-gray-500 py-[10vh] text-[2.5vh] col-span-full">
                    <i class="fa-solid fa-spinner fa-spin mr-[1vw]"></i> Forbinder til markedet...
                </div>
            </div>
        </div>
        
    </main>

    <!-- Logic -->
<script>
        const API_URL = 'http://127.0.0.1:8000/api/catalog/managed';
        const HYPERPARAMETERS_API_URL = '/api/engine/hyperparameters';
        let priceStateCache = {}; 
        
        function formatPrice(price) {
            return price % 1 === 0 ? price : price.toFixed(2);
        }

        function toggleFullScreen() {
            const icon = document.getElementById('fsIcon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    icon.className = 'fa-solid fa-compress text-[2.5vh]';
                }).catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        icon.className = 'fa-solid fa-expand text-[2.5vh]';
                    });
                }
            }
        }

        async function fetchPrices() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const products = await response.json();
                renderBoard(products);
            } catch (error) {
                console.error('Error fetching market data:', error);
                document.getElementById('price-board').innerHTML = `
                    <div class="text-center text-red-500 py-[10vh] text-[2.5vh] col-span-full">
                        <i class="fa-solid fa-triangle-exclamation mr-[1vw]"></i> Markedsforbindelse tabt
                    </div>`;
            }
        }

        async function fetchCrashStatus() {
            try {
                const response = await fetch(HYPERPARAMETERS_API_URL);
                if (!response.ok) throw new Error('Crash status response was not ok');
                const hyperparameters = await response.json();
                const alert = document.getElementById('crash-alert');
                alert.classList.toggle('hidden', hyperparameters.crash !== true);
            } catch (error) {
                console.error('Error fetching crash status:', error);
            }
        }

        function renderBoard(products) {
            const container = document.getElementById('price-board');
            if (products.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-[10vh] text-[2.5vh] col-span-full">Ingen produkter på markedet lige nu.</div>`;
                return;
            }

            const groupedProducts = {};
            products.forEach(p => {
                const type = p.type || 'Diverse';
                if (!groupedProducts[type]) groupedProducts[type] = [];
                groupedProducts[type].push(p);
            });

            const sortedTypes = Object.keys(groupedProducts).sort();
            let html = '';
            
            sortedTypes.forEach(type => {
                html += `
                    <div class="border-b-[0.2vh] border-slate-700/60 pb-[0.3vh] mb-[0.5vh] mt-[1.5vh] first:mt-0 flex items-end break-inside-avoid break-after-avoid w-full">
                        <h3 class="text-[1.8vh] font-bold text-yellow-600/90 uppercase tracking-widest pl-[0.5vh]">${type}</h3>
                    </div>
                `;

                groupedProducts[type].forEach(product => {
                    const uuid = product.variant_uuid;
                    const curr = product.current_price;

                    // New Caching Logic
                    if (!priceStateCache[uuid]) {
                        priceStateCache[uuid] = {
                            current: curr,
                            previous: product.previous_price !== undefined ? product.previous_price : curr
                        };
                    } else if (priceStateCache[uuid].current !== curr) {
                        priceStateCache[uuid].previous = priceStateCache[uuid].current;
                        priceStateCache[uuid].current = curr;
                    }
                    const prev = priceStateCache[uuid].previous;

                    const diff = Math.round((curr - prev) * 100) / 100;
                    const pct = prev > 0 ? ((diff / prev) * 100).toFixed(1) : 0;
                    
                    let changeHtml = '';
                    if (diff > 0) {
                        changeHtml = `
                            <div class="flex items-center justify-end w-[11vh] shrink-0 gap-[0.5vh]">
                                <span class="neon-green font-bold text-[1.8vh] tracking-tight flex items-center shrink-0"><i class="fa-solid fa-caret-up mr-[0.4vh]"></i>+${formatPrice(diff)}</span>
                                <span class="text-emerald-500/80 text-[1.2vh] font-mono font-bold tracking-tighter shrink-0">(+${pct}%)</span>
                            </div>`;
                    } else if (diff < 0) {
                        changeHtml = `
                            <div class="flex items-center justify-end w-[11vh] shrink-0 gap-[0.5vh]">
                                <span class="neon-red font-bold text-[1.8vh] tracking-tight flex items-center shrink-0"><i class="fa-solid fa-caret-down mr-[0.4vh]"></i>${formatPrice(diff)}</span>
                                <span class="text-rose-500/80 text-[1.2vh] font-mono font-bold tracking-tighter shrink-0">(${pct}%)</span>
                            </div>`;
                    } else {
                        changeHtml = `
                            <div class="flex items-center justify-end w-[11vh] shrink-0">
                                <span class="text-gray-600 font-medium text-[1.6vh] flex items-center"><i class="fa-solid fa-minus mr-[0.4vh]"></i>0 kr.</span>
                            </div>`;
                    }

                    html += `
                        <div class="flex justify-between items-center row-border pb-[0.6vh] pt-[0.4vh] px-[1vh] -mx-[1vh] hover:bg-white/5 transition-colors duration-300 rounded w-full break-inside-avoid">
                            <div class="text-gray-100 flex items-center gap-[0.8vw] truncate pr-[1vw] text-[1.8vh] font-medium flex-1 min-w-0">
                                <i class="fa-solid fa-martini-glass text-gray-600 shrink-0 text-[1.4vh]"></i> 
                                <span class="truncate">${product.product_name}</span>
                            </div>
                            <div class="flex items-center justify-end shrink-0 gap-[1.5vw]">
                                <span class="text-white font-bold text-[2.2vh] tracking-wide shrink-0">${formatPrice(curr)} kr.</span>
                                ${changeHtml}
                            </div>
                        </div>
                    `;
                });
            });
            
            container.innerHTML = html;
        }

        fetchPrices();
        fetchCrashStatus();
        setInterval(fetchPrices, 10000);
        setInterval(fetchCrashStatus, 10000);
    </script>
</body>
</html>
