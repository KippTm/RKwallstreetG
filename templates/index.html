<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Street Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Oswald', sans-serif; 
            background-color: #050505; 
            background-image: radial-gradient(circle at center, #111827 0%, #000000 100%);
        }
        
        .gold-text {
            background: linear-gradient(to bottom, #fde047, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .neon-green { 
            color: #22c55e; 
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); 
        }
        
        .neon-red { 
            color: #ef4444; 
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); 
        }
        
        .board-container {
            border: 4px solid #b48600;
            box-shadow: 0 0 30px rgba(180, 134, 0, 0.2), inset 0 0 20px rgba(180, 134, 0, 0.1);
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }

        .row-border { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header Section -->
    <header class="text-center mb-8 space-y-2 mt-4">
        <p class="text-gray-400 tracking-[0.3em] text-sm uppercase">Blok 1 Eksamensfest</p>
        <h1 class="text-6xl md:text-8xl font-bold gold-text uppercase tracking-wider filter drop-shadow-lg">
            Wall Street Bar
        </h1>
        <div class="flex items-center justify-center gap-4 text-green-500 font-bold text-xl tracking-widest mt-2">
            <span>DRINKS</span> <span><i class="fa-solid fa-xmark text-gray-500 text-sm"></i></span> 
            <span>STOCKS</span> <span><i class="fa-solid fa-xmark text-gray-500 text-sm"></i></span> 
            <span>PARTY</span>
        </div>
    </header>

    <!-- Main Stock Exchange Board -->
    <main class="board-container rounded-lg w-full max-w-5xl p-6 md:p-10 relative z-10 flex flex-col">
        
        <!-- Live Managed Products Section -->
        <div class="w-full space-y-6">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end border-b-2 border-green-500/50 pb-3 mb-6">
                <h2 class="text-4xl font-bold neon-green flex items-center gap-4">
                    <i class="fa-solid fa-arrow-trend-up text-3xl"></i> LIVE TRADING
                </h2>
                <div class="text-xs text-gray-400 uppercase tracking-widest font-bold mt-4 sm:mt-0 px-2 flex gap-8">
                    <span>Kurs</span>
                    <span>&AElig;ndring (Tick)</span>
                </div>
            </div>
            
            <!-- JavaScript will populate this container -->
            <div id="price-board" class="grid grid-cols-1 lg:grid-cols-2 gap-x-16 gap-y-4 font-medium text-xl">
                <div class="text-center text-gray-500 py-12 lg:col-span-2">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Forbinder til markedet...
                </div>
            </div>
        </div>
        
    </main>

    <!-- Fetch Logic -->
    <script>
        const API_URL = 'http://127.0.0.1:8000/api/catalog/managed';
        let previousPriceCache = {}; // Cache of variant_uuid -> price from the last tick
        
        function formatPrice(price) {
            return price % 1 === 0 ? price : price.toFixed(2);
        }

        async function fetchPrices() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const products = await response.json();
                renderBoard(products);
            } catch (error) {
                console.error('Error fetching market data:', error);
                document.getElementById('price-board').innerHTML = `
                    <div class="text-center text-red-500 py-12 lg:col-span-2">
                        <i class="fa-solid fa-triangle-exclamation mr-2"></i> Markedsforbindelse tabt
                    </div>`;
            }
        }

        function renderBoard(products) {
            const container = document.getElementById('price-board');
            if (products.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-12 lg:col-span-2">Ingen produkter på markedet lige nu.</div>`;
                return;
            }

            let html = '';
            products.forEach(product => {
                const uuid = product.variant_uuid;
                const curr = product.current_price;

                // Priority: 1) Client cache from previous poll tick
                //           2) Backend previous_price from products.json
                //           3) Current price (if first run and no history)
                let prev;
                if (previousPriceCache[uuid] !== undefined) {
                    prev = previousPriceCache[uuid];
                } else if (product.previous_price !== undefined) {
                    prev = product.previous_price;
                } else {
                    prev = curr;
                }

                const diff = Math.round((curr - prev) * 100) / 100;
                
                let changeHtml = '';
                if (diff > 0) {
                    changeHtml = `<span class="neon-green font-bold text-lg inline-flex items-center ml-3"><i class="fa-solid fa-caret-up mr-0.5 text-sm"></i>+${formatPrice(diff)} kr.</span>`;
                } else if (diff < 0) {
                    changeHtml = `<span class="neon-red font-bold text-lg inline-flex items-center ml-3"><i class="fa-solid fa-caret-down mr-0.5 text-sm"></i>${formatPrice(diff)} kr.</span>`;
                } else {
                    changeHtml = `<span class="text-gray-500 font-medium text-sm inline-flex items-center ml-3"><i class="fa-solid fa-minus mr-0.5 text-xs"></i>0 kr.</span>`;
                }

                html += `
                    <div class="flex justify-between items-center row-border pb-3 hover:bg-white/5 transition-colors duration-300 px-2 -mx-2 rounded">
                        <span class="text-gray-100 flex items-center gap-3 truncate pr-4 text-xl font-medium">
                            <i class="fa-solid fa-martini-glass text-gray-500 text-base"></i> 
                            ${product.product_name}
                        </span>
                        <div class="flex items-baseline justify-end shrink-0">
                            <span class="text-white font-bold text-2xl tracking-wide">${formatPrice(curr)} kr.</span>
                            ${changeHtml}
                        </div>
                    </div>
                `;

                // Update the client cache for the next poll
                previousPriceCache[uuid] = curr;
            });
            container.innerHTML = html;
        }

        // Fetch immediately on load, then poll every 10 seconds
        fetchPrices();
        setInterval(fetchPrices, 10000);
    </script>
</body>
</html>
